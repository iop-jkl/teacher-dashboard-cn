<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting</title>
  </head>
  <body>
    <script>
      sessionStorage.setItem(
        'gh-pages-redirect',
        location.pathname + location.search + location.hash
      );
      location.replace('/teacher-dashboard-cn/');
    </script>
  </body>
</html>
