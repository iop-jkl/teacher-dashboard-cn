name: Update Gitee Pages source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitee-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GH_PAGES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit build output to gitee-pages branch
        run: |
          git config user.name "iop-jkl"
          git config user.email "iop-jkl@users.noreply.github.com"
          git checkout --orphan gitee-pages
          git rm -rf --quiet . || true
          cp -r dist/. .
          git add -A
          git commit --allow-empty -m "chore: update Gitee Pages build"
          git push --force origin HEAD:gitee-pages
