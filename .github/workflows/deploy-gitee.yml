name: Mirror to Gitee Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitee-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GH_PAGES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gitee-dist
          path: dist

  mirror:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gitee-dist
          path: dist
      - name: Push build output to Gitee via SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$GITEE_SSH_KEY" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null || true
          cd dist
          git init -b gitee-pages
          git config user.name "iop-jkl"
          git config user.email "iop-jkl@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "chore: deploy to Gitee Pages"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/gitee_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30" timeout 120 git push --force git@gitee.com:iop-jkl/teacher-dashboard-cn.git HEAD:gitee-pages
