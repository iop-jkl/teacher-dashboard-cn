name: Mirror to Gitee Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitee-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GH_PAGES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: gitee-dist
          path: dist

  mirror:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gitee-dist
          path: dist
      - name: Force push build output to Gitee
        run: |
          cd dist
          git init -b gitee-pages
          git config user.name "iop-jkl"
          git config user.email "iop-jkl@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "chore: deploy to Gitee Pages"
          AUTH=$(printf '%s:%s' 'iop-jkl' "$GITEE_TOKEN" | base64)
          git -c http.extraheader="Authorization: Basic $AUTH" push --force https://gitee.com/iop-jkl/teacher-dashboard-cn.git HEAD:gitee-pages
